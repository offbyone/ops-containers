configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true},"80":{"HTTP":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:5000"}}},
          "$${TS_CERT_DOMAIN}:80":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:5000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  sidecar:
    restart: always
    extends:
      file: ../sidecar-compose.yaml
      service: .simple-sidecar
    hostname: changedetection

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    container_name: changedetection
    labels:
      LOG_EXPORT: "1"
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
        labels: LOG_EXPORT
    network_mode: "service:sidecar"
    volumes:
      - changedetection-data:/datastore
    environment:
      # Use the sockpuppetbrowser (Playwright protocol) for JS-rendered fetches.
      # The browser shares the sidecar's network namespace, so it is reachable
      # on localhost rather than by container name.
      - PLAYWRIGHT_DRIVER_URL=ws://127.0.0.1:3000
    # changedetection must wait for the browser to be up before starting.
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started
    # Configurable proxy list support, see https://github.com/dgtlmoon/changedetection.io/wiki/Proxy-configuration#proxy-list-support
    #        - ./proxies.json:/datastore/proxies.json

    #    environment:
    #        Default listening port, can also be changed with the -p option
    #      - PORT=5000

    #      - PUID=1000
    #      - PGID=1000
    #
    #       Alternative WebDriver/selenium URL, do not use "'s or 's!
    #      - WEBDRIVER_URL=http://browser-chrome:4444/wd/hub
    #
    #       WebDriver proxy settings webdriver_proxyType, webdriver_ftpProxy, webdriver_noProxy,
    #                                webdriver_proxyAutoconfigUrl, webdriver_autodetect,
    #                                webdriver_socksProxy, webdriver_socksUsername, webdriver_socksVersion, webdriver_socksPassword
    #
    #             https://selenium-python.readthedocs.io/api.html#module-selenium.webdriver.common.proxy
    #
    #       Alternative Playwright URL, do not use "'s or 's!
    #       (enabled above via PLAYWRIGHT_DRIVER_URL over the shared sidecar namespace)
    #
    #       Playwright proxy settings playwright_proxy_server, playwright_proxy_bypass, playwright_proxy_username, playwright_proxy_password
    #
    #             https://playwright.dev/python/docs/api/class-browsertype#browser-type-launch-option-proxy
    #
    #        Plain requests - proxy support example.
    #      - HTTP_PROXY=socks5h://10.10.1.10:1080
    #      - HTTPS_PROXY=socks5h://10.10.1.10:1080
    #
    #        An exclude list (useful for notification URLs above) can be specified by with
    #      - NO_PROXY="localhost,192.168.0.0/24"
    #
    #        Base URL of your changedetection.io install (Added to the notification alert)
    #      - BASE_URL=https://mysite.com
    #        Respect proxy_pass type settings, `proxy_set_header Host "localhost";` and `proxy_set_header X-Forwarded-Prefix /app;`
    #        More here https://github.com/dgtlmoon/changedetection.io/wiki/Running-changedetection.io-behind-a-reverse-proxy-sub-directory
    #      - USE_X_SETTINGS=1
    #
    #        Hides the `Referer` header so that monitored websites can't see the changedetection.io hostname.
    #      - HIDE_REFERER=true
    #
    #        Default number of parallel/concurrent fetchers
    #      - FETCH_WORKERS=10

    # Comment out ports: when using behind a reverse proxy , enable networks: etc.
    restart: always

  # Sockpuppetbrowser is Chrome wrapped in an API for fast fetching of web pages
  # via the Playwright protocol. It shares the sidecar's network namespace, so
  # changedetection reaches it on ws://127.0.0.1:3000 (see PLAYWRIGHT_DRIVER_URL).
  browser-sockpuppet-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: changedetection-browser
    network_mode: "service:sidecar"
    restart: always
    # SYS_ADMIN might be more than strictly required, but it is often needed for
    # Chrome/puppeteer inside a container. See
    # https://github.com/puppeteer/puppeteer/blob/main/docs/troubleshooting.md#running-puppeteer-on-gitlabci
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  changedetection-data:
  tailscale-data:
