---
- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ repo_path }}"
    state: directory
    mode: "0755"

# Sync the files for every candidate service (`_candidates`, resolved in
# setup.yml, already honours `-e service=<name>`). Scoping the sync to the
# selected service(s) means a single-service run only copies that service's
# files instead of the whole tree. Both systemd- and compose-managed services
# need their files on the remote, so this uses the full candidate list rather
# than either split.
- name: Build the list of service directories to sync
  ansible.builtin.set_fact:
    _sync_dirs: >-
      {{ _candidates
         | map(attribute='name')
         | list }}

# Resolve jj's absolute path up front rather than relying on the command
# module's PATH. jj is a standalone binary (unlike git, which macOS also ships
# at /usr/bin/git as a fallback), so a run whose environment lacks the Homebrew
# / cargo bin dir -- e.g. one not wrapped in `direnv exec .` -- would otherwise
# fail with "No such file or directory: jj". Search the ambient PATH first, then
# the usual install locations (Apple Silicon Homebrew, Intel Homebrew, cargo),
# and fail with a clear message if none has it.
- name: Locate the jj executable on the controller
  ansible.builtin.shell: >-
    command -v jj
    || for c in /opt/homebrew/bin/jj /usr/local/bin/jj "$HOME/.cargo/bin/jj"; do
         [ -x "$c" ] && { echo "$c"; exit 0; };
       done;
    exit 1
  delegate_to: localhost
  changed_when: false
  check_mode: false
  register: _jj_bin
  when: _sync_dirs | length > 0

- name: Fail with a clear message when jj is not installed on the controller
  ansible.builtin.fail:
    msg: >-
      Could not find the `jj` executable on the Ansible controller. This
      playbook enumerates files to sync via jujutsu. Install jj (e.g.
      `brew install jj`) or run the playbook in an environment where jj is on
      PATH.
  when:
    - _sync_dirs | length > 0
    - _jj_bin.rc | default(1) != 0

# jj is the source of truth for *which* files to copy (this repo is a
# jujutsu-colocated checkout, and the plain-git index can drift out of sync
# with jj's tracked set). `jj file list` reports only version-controlled files,
# so it never picks up runtime state (rendered *.env, container data dirs) that
# lives alongside the repo content on the remote. --ignore-working-copy keeps it
# a fast read-only query. Path arguments resolve relative to CWD, so this must
# run with chdir at the repo root (playbook_dir). sidecar-compose.yaml is a
# repo-root file that service compose files reference via
# `extends: ../sidecar-compose.yaml`, so it must always be present even on a
# single-service run. Note: jj emits a harmless "No matching entries" warning on
# stderr (exit 0) for any candidate dir with no tracked files.
- name: Enumerate tracked files for the selected services
  ansible.builtin.command:
    argv: "{{ [_jj_bin.stdout | trim, 'file', 'list', '--ignore-working-copy', '--'] + _sync_dirs + ['sidecar-compose.yaml'] }}"
    chdir: "{{ playbook_dir }}"
  delegate_to: localhost
  changed_when: false
  check_mode: false
  register: _tracked_files
  when: _sync_dirs | length > 0

# *.template files are rendered separately by render_templates.yml; only their
# rendered output should land on the remote, so drop them here.
- name: Compute the list of files to copy
  ansible.builtin.set_fact:
    _sync_files: >-
      {{ _tracked_files.stdout_lines
         | reject('search', '\.template$')
         | list }}
  when: _sync_dirs | length > 0

# The plain copy loop below does not create intermediate parent directories, so
# derive the unique set of directories that the tracked files live in and create
# them up front. Map each file to its dirname, drop any empty results (repo-root
# files like sidecar-compose.yaml have no directory component), and dedupe.
- name: Compute the needed directories on the remote
  ansible.builtin.set_fact:
    _sync_directories: >-
      {{ _sync_files
         | map('dirname')
         | reject('equalto', '')
         | unique
         | list }}
  when: _sync_dirs | length > 0

- name: Ensure the service directories exist on the remote
  ansible.builtin.file:
    path: "{{ repo_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ _sync_directories | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: _sync_dirs | length > 0

# copy is idempotent via checksum and renders real per-file content under
# --diff, so there is no need for the rsync itemize-changes summary machinery.
# It never deletes, which preserves the remote's runtime state (whole-service
# removal stays the job of playbook-cleanup-unmanaged.yml).
- name: Copy service files to remote
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "{{ repo_path }}/{{ item }}"
    mode: preserve
  loop: "{{ _sync_files | default([]) }}"
  loop_control:
    label: "{{ item }}"
  # Registered so systemd_service.yml can tell which services' files changed this
  # run and restart only those (the `item` is the repo-relative path, e.g.
  # `seerr/compose.yaml`).
  register: _sync_copy
  when: _sync_dirs | length > 0
