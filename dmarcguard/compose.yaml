---
name: dmarcguard

configs:
  ts-serve:
    content: |
      {
      "TCP":{
        "443":{"HTTPS":true},
        "80":{"HTTP":true}
        },
        "Web":{
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers":{ "/": {"Proxy":"http://127.0.0.1:8080"}}
          },
          "$${TS_CERT_DOMAIN}:80": {
            "Handlers":{"/": {"Proxy":"http://127.0.0.1:8080"}}
          }
        },
        "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}
      }

services:
  sidecar:
    restart: always
    extends:
      file: ../sidecar-compose.yaml
      service: .simple-sidecar
    hostname: dmarcguard

  dmarcguard:
    image: meysam81/parse-dmarc:latest
    network_mode: service:sidecar
    labels:
      LOG_EXPORT: "1"
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
        labels: LOG_EXPORT
    volumes:
      - "data:/data"
    env_file: .env
    environment:
      IMAP_PROCESSED_MAILBOX: "To/dmarc-reports"
volumes:
  data:
  tailscale-data:
